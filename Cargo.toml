[package]
name = "dkbot-dragonwilds"
version = "0.1.0"
edition = "2021"
description = "Plugin dkbot : administration d'un serveur RuneScape: Dragonwilds via RSDWServerAPI"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
dkbot-host-api = { git = "https://github.com/ApachaiZ/dkbot-base", tag = "v0.2.0" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
